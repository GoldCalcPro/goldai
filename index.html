<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldCalc Pro</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

h1{
color:gold;
}

input{
width:90%;
padding:15px;
margin:10px;
border-radius:10px;
border:none;
font-size:18px;
}

button{
width:95%;
padding:15px;
background:gold;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

#result{
margin-top:20px;
font-size:24px;
color:lime;
}

</style>

</head>

<body>

<h1>GoldCalc Pro</h1>

<p>Risk Calculator</p>

<input id="balance" placeholder="Account Balance">

<input id="risk" placeholder="Risk %">
<input id="entry" placeholder="Entry Price">

<input id="sl" placeholder="Stop Loss">

<input id="tp" placeholder="Take Profit">
<input id="pipValue" placeholder="Value per Lot">

<button onclick="calculate()">
Calculate
</button>

<div id="result"></div>
<div id="aiResult"></div>
<script>
function calculate(){

let balance = parseFloat(document.getElementById("balance").value);
let risk = parseFloat(document.getElementById("risk").value);
let entry = parseFloat(document.getElementById("entry").value);
let sl = parseFloat(document.getElementById("sl").value);
let tp = parseFloat(document.getElementById("tp").value);
let pipValue = parseFloat(document.getElementById("pipValue").value);
let riskAmount = (balance * risk) / 100;
let slDistance = Math.abs(entry - sl);
let tpDistance = Math.abs(tp - entry);
let tradeType = "";

if (tp > entry) {
    tradeType = "🟢 BUY";
} else if (tp < entry) {
    tradeType = "🔴 SELL";
} else {
tradeType = "⚪ UNKNOWN";
}
let rr = (tpDistance / slDistance).toFixed(2);
let lotSize = (riskAmount / (slDistance * pipValue)).toFixed(2);
document.getElementById("result").innerHTML =
"Risk = $" + riskAmount.toFixed(2) +
"<br>Lot Size = " + lotSize +
"<br>SL Distance = " + slDistance +
"<br>TP Distance = " + tpDistance +
"<br>Risk : Reward = 1 : " + rr;

let signal = "";
let score = 0;

let confidence = 0;
let recommendation = "";
let reason = "";


// AI Signal Score
if (rr >= 2) {
  score += 20;
}

if (slDistance <= 20) {
  score += 20;
}

if (tpDistance >= slDistance * 2) {
  score += 20;
}

if (lotSize <= 1) {
  score += 20;
}

if (risk <= 2) {
  score += 20;
}
if (score >= 80) {
    signal = "🟢 STRONG TRADE";
} else if (score >= 60) {
    signal = "🟡 GOOD TRADE";
} else if (score >= 40) {
    signal = "🟠 RISKY";
} else {
    signal = "🔴 SKIP TRADE";
}
confidence = score;

if (score >= 80) {
    recommendation = "Entry sekarang";
    reason = "Setup sangat kuat dengan risk-reward yang baik.";
} else if (score >= 60) {
    recommendation = "Boleh entry tetapi berhati-hati";
    reason = "Setup masih baik tetapi perlukan disiplin.";
} else if (score >= 40) {
    recommendation = "Tunggu confirmation";
    reason = "Signal belum cukup kuat.";
} else {
    recommendation = "Jangan entry";
    reason = "Setup tidak memenuhi syarat.";
}
document.getElementById("aiResult").innerHTML =
"<h2>🤖 AI Analysis</h2>" +
"<br><b>Trade Type:</b> " + tradeType +
"<br><b>AI Score:</b> " + score + "/100" +
"<br><b>Signal:</b> " + signal +
"<br><b>Confidence:</b> " + confidence + "%" +
"<br><b>Recommendation:</b> " + recommendation +
"<br><b>Reason:</b> " + reason;
}
</script>
</body>
</html>
