<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldCalc Pro</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

h1{
color:gold;
}

input{
width:90%;
padding:15px;
margin:10px;
border-radius:10px;
border:none;
font-size:18px;
}

button{
width:95%;
padding:15px;
background:gold;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

#result{
margin-top:20px;
font-size:24px;
color:lime;
}

</style>

</head>

<body>

<h1>GoldCalc Pro</h1>

<p>Risk Calculator</p>

<input id="balance" placeholder="Account Balance">

<input id="risk" placeholder="Risk %">
<input id="entry" placeholder="Entry Price">

<input id="sl" placeholder="Stop Loss">

<input id="tp" placeholder="Take Profit">
<button onclick="calculate()">
Calculate
</button>

<div id="result"></div>

<script>

function calculate(){

let balance=document.getElementById("balance").value;

let risk=document.getElementById("risk").value;

let amount=(balance*risk)/100;

document.getElementById("result").innerHTML="Risk = $"+amount;

}

</script>

</body>

</html>
